server {
    listen 80;
    server_name sferum-buro.ru www.sferum-buro.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sferum-buro.ru www.sferum-buro.ru;

    ssl_certificate /etc/letsencrypt/live/sferum-buro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sferum-buro.ru/privkey.pem;

    # Webhook для бота
    location /webhook {
        proxy_pass http://127.0.0.1:18085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
        proxy_read_timeout 35s;
    }

    # Мини-приложение
    location /app {
        proxy_pass http://127.0.0.1:18085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # API мини-приложения
    location /app/api {
        proxy_pass http://127.0.0.1:18085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
